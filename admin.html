<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Armenian Plagiarism Detector</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== GLOBAL STYLES (synchronized with lecturer/student dashboards) ===== */
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --danger: #f72585;
            --warning: #f8961e;
            --dark: #1e1e2f;
            --light: #f8f9fa;
            --gray: #6c757d;
            --border: #e2e8f0;
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans Armenian', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Sidebar (same as lecturer/student) */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 2rem 1.5rem;
            z-index: 1000;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sidebar .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 1rem 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .sidebar .nav-link i {
            width: 24px;
            text-align: center;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            transform: translateX(5px);
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3);
        }

        .sidebar button {
            background: transparent;
            border: none;
            font-size: 1rem;
        }

        /* Main content */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
            min-height: 100vh;
        }

        /* Top navbar area (page header) */
        .page-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--dark), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }

        .page-header span {
            color: var(--gray);
        }

        /* Cards & Stats */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.15);
            border-color: var(--primary);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 0.5rem;
        }

        .card-text {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--dark);
            margin: 0;
        }

        /* Tables */
        .user-table-container {
            background: white;
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .user-table-container h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.25rem;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 1rem;
            color: var(--gray);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border);
        }

        .data-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--dark);
        }

        .data-table tbody tr {
            transition: all 0.3s ease;
        }

        .data-table tbody tr:hover {
            background: var(--light);
        }

        /* Badges */
        .badge-role {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-lecturer {
            background: rgba(67, 97, 238, 0.12);
            color: #2d47d4;
        }

        .badge-student {
            background: rgba(76, 201, 240, 0.12);
            color: #1a7f9e;
        }

        .badge-admin {
            background: rgba(248, 150, 30, 0.12);
            color: #c2410c;
        }

        /* Form card */
        .form-card {
            background: white;
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        .form-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 500;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 0.7rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.4);
        }

        .btn-danger {
            background: var(--danger);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
        }

        /* Toast message (same as other dashboards) */
        .toast-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 10px;
            padding: 1rem 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            animation: slideIn 0.3s ease;
            border-left: 4px solid var(--primary);
        }

        .toast-message.success {
            border-left-color: var(--success);
        }

        .toast-message.error {
            border-left-color: var(--danger);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 992px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2><i class="fas fa-shield-alt"></i> Admin Panel</h2>
        <a class="nav-link active" href="#"><i class="fas fa-home"></i> Dashboard</a>
        <a class="nav-link" href="#usersSection"><i class="fas fa-users"></i> User Management</a>
        <a class="nav-link" href="#createUserSection"><i class="fas fa-user-plus"></i> Create User</a>
        <button class="nav-link" style="margin-top: auto;" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
    <div class="main-content">
        <div class="page-header">
            <div>
                <p class="text-uppercase text-muted mb-1">Administrator</p>
                <h1>Admin Dashboard</h1>
            </div>
            <div>
                <span id="adminName" class="text-muted"></span>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Total Users</h4>
                    <p class="card-text" id="totalUsers">0</p>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Active Roles</h4>
                    <p class="card-text" id="roleSummary">Loading...</p>
                </div>
            </div>
        </div>

        <div class="user-table-container" id="usersSection">
            <div>
                <h3>Users</h3>
                <p class="text-muted mb-3">Manage lecturers and students.</p>
            </div>
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Last Login</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="7" class="text-center py-4">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="form-card mt-4" id="createUserSection">
            <h3>Create New User</h3>
            <form id="createUserForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input type="text" id="newUsername" class="form-control" placeholder="Enter username" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="newFullName" class="form-control" placeholder="Enter full name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" id="newEmail" class="form-control" placeholder="Enter email" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Role</label>
                        <select id="newRole" class="form-select" required>
                            <option value="lecturer">Lecturer</option>
                            <option value="student">Student</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input type="password" id="newPassword" class="form-control" placeholder="Enter password" required>
                    </div>
                    <div class="col-12">
                        <div id="adminFeedback" class="text-danger mb-2"></div>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-plus-circle"></i> Create User</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api';

        document.addEventListener('DOMContentLoaded', () => {
            loadAdmin();
            document.getElementById('createUserForm').addEventListener('submit', createUser);
        });

        async function loadAdmin() {
            const user = await fetchCurrentUser();
            if (!user || user.role !== 'admin') {
                window.location.href = '/';
                return;
            }
            document.getElementById('adminName').textContent = user.full_name;
            await loadUsers();
        }

        async function fetchCurrentUser() {
            try {
                const res = await fetch(`${API_URL}/current-user`, { credentials: 'include' });
                const data = await res.json();
                return data.success ? data.user : null;
            } catch (error) {
                return null;
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch(`${API_URL}/admin/users`, { credentials: 'include' });
                const data = await res.json();
                if (!data.success) {
                    showToast(data.error || 'Unable to load users', 'error');
                    return;
                }
                const users = data.users || [];
                const tbody = document.getElementById('usersTableBody');
                const totalUsers = document.getElementById('totalUsers');
                const roleSummary = document.getElementById('roleSummary');
                const counts = { lecturers: 0, students: 0, admins: 0 };

                if (!users.length) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">No users found.</td></tr>';
                } else {
                    tbody.innerHTML = users.map(user => {
                        counts[user.role + 's'] = (counts[user.role + 's'] || 0) + 1;
                        const badgeClass = user.role === 'lecturer' ? 'badge-lecturer' : user.role === 'student' ? 'badge-student' : 'badge-admin';
                        const lastLogin = user.last_login ? new Date(user.last_login).toLocaleString() : 'Never';
                        const deleteButton = user.role === 'admin' 
                            ? '<button class="btn btn-sm btn-outline-secondary" disabled><i class="fas fa-lock"></i></button>' 
                            : `<button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id})"><i class="fas fa-trash-alt"></i></button>`;
                        return `
                            <tr>
                                <td>${user.id}</td>
                                <td>${escapeHtml(user.username)}</td>
                                <td>${escapeHtml(user.full_name)}</td>
                                <td>${escapeHtml(user.email)}</td>
                                <td><span class="badge-role ${badgeClass}">${escapeHtml(user.role)}</span></td>
                                <td>${escapeHtml(lastLogin)}</td>
                                <td>${deleteButton}</td>
                            </tr>
                        `;
                    }).join('');
                }

                totalUsers.textContent = users.length;
                roleSummary.textContent = `${counts.lecturers || 0} lecturers · ${counts.students || 0} students · ${counts.admins || 0} admins`;
            } catch (error) {
                showToast('Unable to load users', 'error');
                console.error('loadUsers error', error);
            }
        }

        async function createUser(event) {
            event.preventDefault();
            const username = document.getElementById('newUsername').value.trim();
            const fullName = document.getElementById('newFullName').value.trim();
            const email = document.getElementById('newEmail').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const role = document.getElementById('newRole').value;
            const feedback = document.getElementById('adminFeedback');

            feedback.textContent = '';

            if (!username || !fullName || !email || !password) {
                feedback.textContent = 'All fields are required.';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/admin/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, full_name: fullName, email, password, role }),
                    credentials: 'include'
                });
                const data = await res.json();
                if (!data.success) {
                    feedback.textContent = data.error || 'Unable to create user.';
                    return;
                }
                showToast('User created successfully');
                document.getElementById('createUserForm').reset();
                loadUsers();
            } catch (error) {
                feedback.textContent = 'Unable to create user.';
                console.error('createUser error', error);
            }
        }

        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            try {
                const res = await fetch(`${API_URL}/admin/users/${userId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                const data = await res.json();
                if (!data.success) {
                    showToast(data.error || 'Unable to delete user', 'error');
                    return;
                }
                showToast('User deleted successfully');
                loadUsers();
            } catch (error) {
                showToast('Unable to delete user', 'error');
                console.error('deleteUser error', error);
            }
        }

        function logout() {
            fetch(`${API_URL}/logout`, { method: 'POST', credentials: 'include' })
                .finally(() => window.location.href = '/');
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast-message ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i><span>${escapeHtml(message)}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString().replace(/[&<>"]/g, function(match) {
                if (match === '&') return '&amp;';
                if (match === '<') return '&lt;';
                if (match === '>') return '&gt;';
                if (match === '"') return '&quot;';
                return match;
            });
        }
    </script>
</body>
</html>
